<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>DST License Admin</title>
<meta name="robots" content="noindex, nofollow" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #131718;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 480px;
    margin: 40px 20px;
    padding: 30px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 6px;
  }
  p.subtitle {
    color: rgba(255, 255, 255, 0.6);
    font-size: 0.9rem;
    margin: 0 0 24px;
    line-height: 1.5;
  }
  label {
    display: block;
    font-size: 0.85rem;
    color: rgba(255, 255, 255, 0.7);
    margin: 16px 0 6px;
  }
  label.optional::after {
    content: " (optional -- syncs their dashboard too)";
    color: rgba(255, 255, 255, 0.4);
    font-weight: normal;
  }
  input {
    width: 100%;
    padding: 10px 14px;
    font-size: 0.95rem;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 8px;
    color: #fff;
  }
  input::placeholder { color: rgba(255, 255, 255, 0.35); }
  button {
    width: 100%;
    margin-top: 24px;
    padding: 12px 20px;
    background-color: #fff;
    color: #000;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:hover { background-color: #ccc; }
  button:disabled { opacity: 0.6; cursor: default; }
  .result {
    margin-top: 20px;
    padding: 14px;
    border-radius: 8px;
    font-size: 0.9rem;
    line-height: 1.5;
    display: none;
    white-space: pre-wrap;
  }
  .result.error {
    display: block;
    background: rgba(255, 100, 100, 0.1);
    border: 1px solid rgba(255, 100, 100, 0.3);
    color: #ff8080;
  }
  .result.success {
    display: block;
    background: rgba(120, 220, 150, 0.1);
    border: 1px solid rgba(120, 220, 150, 0.3);
    color: #7fdc9c;
  }
  .hidden { display: none; }
  .back-link {
    display: inline-block;
    margin-top: 16px;
    font-size: 0.85rem;
    color: rgba(255, 255, 255, 0.5);
    text-decoration: none;
    cursor: pointer;
  }
  .back-link:hover { color: #fff; }
</style>
</head>
<body>
  <div class="card" id="gate-card">
    <h1>DST License Admin</h1>
    <p class="subtitle">Enter the admin password to continue.</p>
    <label for="gate-password">Password</label>
    <input type="password" id="gate-password" placeholder="Password" autocomplete="off" />
    <button id="unlock-btn">Unlock</button>
    <div id="gate-result" class="result"></div>
  </div>

  <div class="card hidden" id="tool-card">
    <h1>Reset a DST License (error 4)</h1>
    <p class="subtitle">Deletes the customer's broken license and issues a fresh one on the same SKU. Not undoable -- double-check the serial before hitting reset.</p>

    <label for="serial">Broken serial (from the customer's email)</label>
    <input type="text" id="serial" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX" autocomplete="off" />

    <label for="email" class="optional">Customer email</label>
    <input type="email" id="email" placeholder="customer@example.com" autocomplete="off" />

    <button id="submit-btn">Reset License</button>

    <div id="result" class="result"></div>
    <a class="back-link" id="lock-link">Lock</a>
  </div>

  <script>
    const gateCard = document.getElementById("gate-card");
    const toolCard = document.getElementById("tool-card");
    const gatePasswordInput = document.getElementById("gate-password");
    const gateResultEl = document.getElementById("gate-result");
    const unlockBtn = document.getElementById("unlock-btn");
    const lockLink = document.getElementById("lock-link");

    let adminPassword = "";

    function showTool(pw) {
      adminPassword = pw;
      gateCard.classList.add("hidden");
      toolCard.classList.remove("hidden");
    }

    function lock() {
      adminPassword = "";
      sessionStorage.removeItem("dstAdminPassword");
      gatePasswordInput.value = "";
      toolCard.classList.add("hidden");
      gateCard.classList.remove("hidden");
    }

    lockLink.addEventListener("click", lock);

    // Remember the password for the rest of this browser tab session so a
    // page refresh doesn't force retyping it.
    const savedPassword = sessionStorage.getItem("dstAdminPassword");
    if (savedPassword) {
      showTool(savedPassword);
    }

    unlockBtn.addEventListener("click", () => {
      const pw = gatePasswordInput.value.trim();
      if (!pw) {
        gateResultEl.className = "result error";
        gateResultEl.textContent = "Enter the password first.";
        return;
      }
      sessionStorage.setItem("dstAdminPassword", pw);
      showTool(pw);
    });

    gatePasswordInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") unlockBtn.click();
    });

    const btn = document.getElementById("submit-btn");
    const resultEl = document.getElementById("result");

    btn.addEventListener("click", async () => {
      const oldSerial = document.getElementById("serial").value.trim();
      const customerEmail = document.getElementById("email").value.trim();

      resultEl.className = "result";
      resultEl.textContent = "";

      if (!oldSerial) {
        resultEl.className = "result error";
        resultEl.textContent = "Paste the broken serial first.";
        return;
      }

      const confirmMsg = customerEmail
        ? `This will permanently delete serial ${oldSerial} and replace it with a new one, and update ${customerEmail}'s Shopify account. This cannot be undone. Continue?`
        : `This will permanently delete serial ${oldSerial} and replace it with a new one. No email was given, so no Shopify account will be updated -- you'll need to relay the new serial yourself. This cannot be undone. Continue?`;
      if (!confirm(confirmMsg)) return;

      btn.disabled = true;
      btn.textContent = "Working...";

      try {
        const res = await fetch("/api/admin/reset-license", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            password: adminPassword,
            oldSerial,
            customerEmail: customerEmail || undefined,
          }),
        });
        const data = await res.json();

        if (!res.ok) {
          resultEl.className = "result error";
          resultEl.textContent = data.error || "Something went wrong.";
          if (res.status === 401) lock();
        } else {
          resultEl.className = "result success";
          resultEl.textContent = data.shopifyUpdated
            ? `Done. New serial: ${data.newSerial}. ${data.customerEmail}'s Shopify account has been updated automatically.`
            : `Done. New serial: ${data.newSerial}. No email was given, so send this serial to the customer yourself.`;
        }
      } catch (err) {
        resultEl.className = "result error";
        resultEl.textContent = "Network error -- please try again.";
      } finally {
        btn.disabled = false;
        btn.textContent = "Reset License";
      }
    });
  </script>
</body>
</html>
